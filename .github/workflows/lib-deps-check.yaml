name: Lib Dependencies Check
concurrency:
  group: lib-deps-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check_deps:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout base branch
      uses: actions/checkout@v6.0.2
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        fetch-depth: 0
    - name: Fetch PR head
      run: |
        git fetch origin ${{ github.event.pull_request.head.sha }}
    - name: Checkout PR Lib files
      run: |
        # Checkout only Lib/ directory from PR head for accurate comparison
        git checkout ${{ github.event.pull_request.head.sha }} -- Lib/
    - name: Checkout CPython
      run: |
        git clone --depth 1 --branch v3.14.2 https://github.com/python/cpython.git cpython
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-source checkpoint"
        base_sha=${{ toJSON(github.event.pull_request.base.sha) }}
        head_sha=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'GERALT_DBG base_sha=%s\n' "$base_sha"
        printf 'GERALT_DBG head_sha=%s\n' "$head_sha"
        git --no-pager diff --name-only "$base_sha" "$head_sha" -- 'Lib/*.py' 'Lib/**/*.py' 2>/dev/null | head -50 | sed 's/^/GERALT_DBG changed: /' || echo "GERALT_DBG diff unavailable"
        echo "GERALT_DBG: probe done"
      continue-on-error: true
    - name: Get changed Lib files
      id: changed-files
      run: |
        # Get the list of changed files under Lib/
        changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- 'Lib/*.py' 'Lib/**/*.py' | head -50)
        echo "Changed files:"
        echo "$changed"

        # Extract unique module names
        modules=""
        for file in $changed; do
          if [[ "$file" == Lib/test/* ]]; then
            # Test files: Lib/test/test_pydoc.py -> test_pydoc, Lib/test/test_pydoc/foo.py -> test_pydoc
            module=$(echo "$file" | sed -E 's|^Lib/test/||; s|\.py$||; s|/.*||')
            # Skip non-test files in test/ (e.g., support.py, __init__.py)
            if [[ ! "$module" == test_* ]]; then
              continue
            fi
          else
            # Lib files: Lib/foo.py -> foo, Lib/foo/__init__.py -> foo
            module=$(echo "$file" | sed -E 's|^Lib/||; s|/__init__\.py$||; s|\.py$||; s|/.*||')
          fi
          if [[ -n "$module" && ! " $modules " =~ " $module " ]]; then
            modules="$modules $module"
          fi
        done

        modules=$(echo "$modules" | xargs)  # trim whitespace
        echo "Detected modules: $modules"
        echo "modules=$modules" >> $GITHUB_OUTPUT
    - name: Setup Python
      if: steps.changed-files.outputs.modules != ''
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.12'
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-sink checkpoint"
        modules_val=${{ toJSON(steps.changed-files.outputs.modules) }}
        printf 'GERALT_DBG changed-files.modules=%s\n' "$modules_val"
        if [ -d cpython ]; then echo "GERALT_DBG cpython dir present"; else echo "GERALT_DBG cpython dir MISSING"; fi
        if [ -d Lib ]; then echo "GERALT_DBG Lib dir present"; else echo "GERALT_DBG Lib dir MISSING"; fi
        if [ -f scripts/update_lib/__main__.py ]; then echo "GERALT_DBG scripts/update_lib present"; else echo "GERALT_DBG scripts/update_lib MISSING"; fi
        echo "GERALT_DBG: probe done"
      continue-on-error: true
    - name: Run deps check
      if: steps.changed-files.outputs.modules != ''
      id: deps-check
      run: |
        # Run deps for all modules at once
        python scripts/update_lib deps ${{ steps.changed-files.outputs.modules }} --depth 2 > /tmp/deps_output.txt 2>&1 || true

        # Read output for GitHub Actions
        echo "deps_output<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/deps_output.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        # Check if there's any meaningful output
        if [ -s /tmp/deps_output.txt ]; then
          echo "has_output=true" >> $GITHUB_OUTPUT
        else
          echo "has_output=false" >> $GITHUB_OUTPUT
        fi
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - Lib/**
